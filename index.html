<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- API produits (extension WordPress « SKLUBS Configurateur ») : vide = fichiers du dépôt -->
  <meta name="sklubs-api" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SKLUBS — Configurateurs drinkware</title>
  <meta name="description" content="Choisissez un produit et personnalisez-le en 3D : bouteilles, tumblers, mugs, thermos, gobelets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>
  <header class="h-top">
    <a class="wordmark" href="./">SKLUBS</a>
    <span class="crumb">Drinkware</span>

  <main class="h-main">
    <section class="h-hero">
      <p class="eyebrow">Configurateur drinkware</p>
      <h1>Qu'est-ce qu'on fabrique&nbsp;?</h1>

    <nav class="h-cats" id="cats" aria-label="Catégories"></nav>

    <span>Rendus 3D issus de masters reconstruits sur photo produit.</span>
