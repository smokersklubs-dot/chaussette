<!--
  SKLUBS — configurateur 3D dans une page WordPress de sklubs.fr.
  À coller tel quel dans un bloc « HTML personnalisé » (ex. page /configurateur/).
  Prérequis : extension « SKLUBS Configurateur » activée (point d'envoi des projets + jeton).
  Adresse : accueil du configurateur (tous les produits). Pour ouvrir directement la bouteille :
  https://bouteille.sklubs.fr/configurateur?produit=cricket-bottle
-->
<div class="sklubs-bottle-frame" style="position:relative;width:100%;height:min(90vh,880px);min-height:620px;border-radius:14px;overflow:hidden;background:#F6F6F4">
  <iframe id="sklubs-bottle" src="https://bouteille.sklubs.fr/" title="Configurateur 3D SKLUBS"
          style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="fullscreen" loading="lazy"></iframe>
</div>
<script>
(function () {
  var frame = document.getElementById('sklubs-bottle');
  var configuratorOrigin = new URL(frame.src, window.location.href).origin;
  var cfg = window.SKLUBS_BOTTLE || {};   // injecté par l'extension : { endpoint, nonce }
  window.addEventListener('message', function (e) {
    if (e.origin !== configuratorOrigin || !e.data || e.data.type !== 'sklubs:bottle:project' || e.source !== frame.contentWindow) return;
    if (!cfg.endpoint) {
      frame.contentWindow.postMessage({ type: 'sklubs:bottle:project-error', message: 'Réception des projets non configurée sur le site.' }, configuratorOrigin);
      return;
    }
    var order = e.data.project && e.data.project.intent === 'order';
    fetch(order && cfg.cart ? cfg.cart : cfg.endpoint, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-WP-Nonce': cfg.nonce },
      body: JSON.stringify(e.data.project)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || r.status); return j; }); })
      .then(function (j) {
        frame.contentWindow.postMessage({ type: 'sklubs:bottle:project-received', reference: j.reference, redirect: j.redirect || null }, configuratorOrigin);
        if (order && j.redirect) window.location.href = j.redirect; // panier WooCommerce
      })
      .catch(function (err) { frame.contentWindow.postMessage({ type: 'sklubs:bottle:project-error', message: 'Envoi impossible (' + err.message + '). Réessayez ou contactez SKLUBS.' }, configuratorOrigin); });
  });
})();
</script>
